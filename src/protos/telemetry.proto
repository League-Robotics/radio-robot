syntax = "proto3";

package robot;

import "options.proto";
import "common.proto";

// ---------------------------------------------------------------------------
// Telemetry -- FRAME v2 (115-003, gut-to-minimal-firmware S1: motion-stack
// excision + minimal per-cycle telemetry, implementing
// `telemetry-frame-tightening-amendment-to-gut-s1.md`). This is a CLEAN,
// INCOMPATIBLE rewrite of the ack-ring/bool-flag frame the 103-era schema
// shipped -- COMPAT BREAK: no wire compatibility with any pre-115 client.
// Every field is renumbered from a blank slate (Telemetry has still never
// shipped to a real robot -- declared-only until ticket 005 wires a live
// emitter -- so there is no deployed client to preserve numbers for; see
// this message's renumbering rule below).
//
// What changed from the 103-era frame:
//   - Per-source reading objects, TIMESTAMPED. `EncoderReading` replaces the
//     flat `enc_left/enc_right/vel_left/vel_right` floats -- position AND
//     velocity now ride together with the sample's own collect time.
//     `OtosReading` replaces the bare `Pose2D otos` -- it now also carries
//     the OTOS-measured velocities (v_x/v_y/omega), which the driver always
//     read and previously dropped on the floor, plus the burst's own
//     read time.
//   - ONE flags bit-string. The depth-3 ack ring (`repeated AckEntry`) and
//     nine standalone status bools plus two `fault_bits`/`event_bits`
//     bitmasks all fold into a single `flags` field -- status, fault, AND
//     event bits share one 16-bit-documented space (bits 16+ reserved).
//   - Single ack slot. `ack_corr`/`ack_err` replace the depth-3 `AckEntry`
//     ring -- a command acked within the same primary period as another
//     overwrites (stakeholder-accepted tradeoff: rare at bench rates,
//     `wait_for_ack` timeout+retry already covers it).
//   - Packed `line`/`color` sensor words -- new live consumers for the
//     line/color drivers the gut keeps, read at a rate-limited, bus-safe
//     cadence (never a naive per-pass read -- the 098-004 regression is the
//     standing precedent).
//   - `DriveMode` relocated in from the now-deleted planner.proto (its own
//     enum, unchanged shape).
//   - Deleted entirely: `AckEntry` + `AckStatus` (the ack ring and its
//     six Motion::Executor completion-outcome enumerators -- the executor
//     that produced them is gone); `ExecutorState` (queue/state-machine
//     visibility -- no queue exists in S1); `HeadingSourceStatus`
//     (App::HeadingSource is deleted -- no reported heading-source sensor
//     to expose); `queue_depth`/`active_id`/`exec_state`/`heading_source`
//     fields (executor-era reporting, already gone per the gut issue);
//     every `has_*` presence bool (folded into `flags`' presence bits).
//   - Every-cycle emission: primary period == cycle period (20 ms, not the
//     stale 40 ms this frame's old doc comment claimed matched already --
//     see `kcycle-kprimaryperiod-mismatch.md`, resolved by this rewrite).
//     "The frame is the dataset": with a timestamped frame every loop
//     iteration, the host log reconstructs any window -- no on-chip
//     measurement ring, no dump command (both deleted by the same gut
//     ticket that lands this rewrite).
//
// Renumbering (decided, `telemetry-frame-tightening-amendment-to-gut-s1.md`):
// clean renumber, every field <= 15 so every tag is 1 byte; NO `reserved`
// list -- the only consumer is this repo's own host, whose `pb2` bindings
// regenerate from the identical protos firmware co-deploys from at the
// bench, so there is no external client's field-number expectation to
// preserve (contrast envelope.proto's `CommandEnvelope`/`ConfigDelta`,
// which reserve removed numbers because THEY shipped on real hardware).
//
// Worst-case size (gen_messages.py-measured, sprint 115 ticket 003 --
// replaces `telemetry-frame-tightening-amendment-to-gut-s1.md`'s ~137 B
// estimate with the real number):
//   Telemetry, standalone (no enclosing tag/length prefix): 144 B.
//   Wrapped as ReplyEnvelope.body's `tlm` arm (how a primary frame actually
//   goes on the wire -- envelope.proto's "telemetry-only return path"):
//   147 B arm contribution (144 B payload + 1 B tag + 2 B length, since
//   144 >= 128 needs a 2-byte length varint); ReplyEnvelope total (corr_id
//   + this arm) = 153 B, 33 B margin under the 186-byte envelope budget.
// Pre-rewrite (103-era ack-ring/bool-flag frame), same ReplyEnvelope-total
// convention: 179 B, 7 B margin (spike-003's own measurement) -- this
// rewrite is smaller by 26 B while carrying strictly more signal
// (per-sample timestamps, OTOS velocities, packed line/color words).
//
// 120 (ack ring, ADDITIVE): field 14 (`acks`, `repeated AckEntry`, depth 4)
// replaces the single ack slot's own bench-measured "rare collision"
// assumption -- see bench-single-ack-slot-observability-collapses-at-40ms.md
// and Telemetry.acks's own doc comment below for the full rationale.
// Nothing above is renumbered; ack_corr/ack_err/flags bit 5 keep their
// exact prior meaning. See wire.h's own gen_messages.py-computed
// kReplyEnvelopeMaxEncodedSize comment for the regenerated worst-case size
// this addition pushed the frame to (re-measured, not hand-updated here,
// so it never drifts from the generator's own ground truth).
//
// 123-004 (cycle_busy/cycle_period, ADDITIVE): fields 15/16, migrated onto
// this message from TelemetrySecondary's now-`reserved` fields 11/12 (COBS+
// CRC framing, 123-001/123-002, recomputed the envelope budget to 240B and
// restored the headroom 122-003 was blocked on). Nothing above is
// renumbered or removed. See wire.h's own regenerated worst-case size
// comment for the current number (re-measured, not hand-updated here).
//
// 124-008 (packed telemetry field encoding, issue protocol-v5-...md §B3-B6):
// EncoderReading.position/velocity, OtosReading.x/y/heading/v_x/v_y/omega,
// and common.proto's Pose2D.x/y/h + BodyTwist3.v_x/v_y/omega all switch
// from `float` to `sint32` + a GENERATED `(scale)` option (options.proto)
// -- zigzag-encoded, so a negative value costs the varint width of its
// magnitude, not a sign-extended 10B. `EncoderReading.time`/
// `OtosReading.time` RENAMED to `age` (an absolute robot-clock value could
// never be packed small; `age` is the delta behind Telemetry.now, bounded
// to 255ms -- issue §B2's own field). `AckEntry` is DELETED --
// `Telemetry.acks` is now `repeated uint32` (packed `corr_id<<4|err`, this
// engine's first real packed-repeated-scalar use), and the single
// "freshest ack" slot (`ack_corr`/`ack_err`, fields 5/6, RESERVED not
// reused) is deleted with it -- ring membership already means "really
// acked." `flags`' `(max)` widened to cover `kFlagFaultShapingDisabled`
// (bit 16, already live, previously an unbounded-on-decode defect) and
// this ticket's own new bit 17 (position-rebaseline defensive-clamp
// fault). `EncoderReading.position_epoch` (ADDITIVE, field 4) is the
// position-rebaseline policy's own counter (sprint 124 architecture
// Decision 6, revised twice -- see sprint.md): RobotLoop increments it
// each time it software-rebaselines a wheel's position via the existing,
// unmodified `Devices::Motor::rebaseline()`. Several other fields
// (`now`/`seq`/`ReplyEnvelope.corr_id`/the packed `acks` word) gained
// SIZING-only `(max)` bounds (not hard wire limits -- validateBounds()
// never runs on encode, so none of these are ever enforced against a real
// value) purely to hit this ticket's own ≤130B `kReplyEnvelopeMaxEncodedSize`
// gate once `position_epoch`'s real cost was accounted for. See wire.h's
// own regenerated worst-case size comment for the current number.
//
// 124-009 (RobotState-projection restructure, robot-state-blackboard-
// one-struct-for-all-shared-state-and-telemetry.md; issue §B1/B2): the
// primary `Telemetry` message's fields are unchanged by this ticket (they
// already represented what the host genuinely uses -- no further pruning
// needed). `EncoderReading.age`/`OtosReading.age` now carry REAL per-sample
// capture skew (`age = now - Devices::Motor::sampleTime()`/
// `Devices::Otos::sampleTime()`, converted [us]->[ms]) instead of 124-008's
// honest-zero placeholder. `TelemetrySecondary` is DELETED outright -- see
// that message's own (now-historical) doc comment, below, for the
// survivor-field review.
// ---------------------------------------------------------------------------

// Current drive mode -- relocated here from the deleted planner.proto
// (115-003, gut S1); unchanged shape.
enum DriveMode {
  IDLE      = 0;
  STREAMING = 1;
  TIMED     = 2;
  DISTANCE  = 3;
  GO_TO     = 4;
  VELOCITY  = 5;
}

// One wheel's encoder sample -- position AND velocity together, stamped
// with the sample's own collect time (robot clock, same domain as
// Telemetry.now). Packed fixed-point on the wire (sprint 124 ticket 008,
// issue §B3): position at 1mm scale, velocity at 0.1mm/s scale --
// generated pack*()/unpack*() conversion methods live on the generated
// struct (options.proto's (scale) doc comment), NOT hand-transcribed.
//
// position's (abs_max)=32000 (±32m) is the position-rebaseline policy's
// tight constraint (sprint 124 architecture Decision 6, revised twice --
// see sprint.md): EncoderReading.position accumulates monotonically for
// the entire session (storage side, NezhaMotor::encOffset_, is wide enough
// by many orders of magnitude and never needs widening -- see Decision 6's
// storage-vs-wire analysis). RobotLoop calls the existing, unmodified
// Devices::Motor::rebaseline() (software-only re-anchor, zero bus traffic)
// when a wheel's position nears this bound, and owns position_epoch below.
message EncoderReading {
  sint32 position = 1 [(scale) = 1.0, (abs_max) = 32000];   // [mm] accumulated
  sint32 velocity = 2 [(scale) = 0.1, (abs_max) = 4000];    // [mm/s] signed, measured

  // age -- RENAMED from the old absolute `time` (124-008): an absolute
  // robot-clock ms value cannot be bounded small (it grows for the whole
  // session), so it could never be packed -- this ticket's own ≤130B size
  // gate (issue §B5) is unreachable without shrinking it. `age` is the
  // delta this sample's own collect time is BEHIND Telemetry.now,
  // bounded to 255ms (issue §B2's own field, "age, not age_ms" -- units
  // in the // [ms] tag per naming-and-style.md). This ticket wires the
  // FIELD (rename + bound + always-0 emission, since the current
  // production assembly stamps every reading with the frame's own `now`,
  // i.e. a genuine, honest age of 0) -- making it carry real per-sample
  // collect skew (distinct nonzero left/right/otos values) is §B2's own
  // enabling-change work (a `sampleTime()` accessor on Devices::Motor/
  // Devices::Otos), explicitly deferred: this ticket's own AC forbids any
  // change to Devices::Motor/NezhaMotor/MotorArmor, and the fuller
  // RobotState-projection restructure is ticket 009's job (see this
  // ticket's own "Handoff from 007" section).
  uint32 age = 3 [(max) = 255];  // [ms]

  // position_epoch (124-008, Decision 6, ADDITIVE): increments each time
  // RobotLoop software-rebaselines this wheel's position (an 8-bit
  // wrap-around counter suffices -- Decision 6's own sizing). Owned and
  // incremented by RobotLoop itself, never by Devices::Motor/NezhaMotor/
  // MotorArmor (unchanged by this ticket). A host observing an epoch
  // change knows a rebase occurred even if it missed the exact boundary
  // frame -- see Decision 6's "Host reconciliation" note.
  // (max)=127, not 255 (124-008, issue §B5's own size-accounting table --
  // needed to hit the ≤130B gate): a SIZING bound (same non-hard-limit
  // status as now's/seq's own bounds just above, telemetry.proto's
  // Telemetry message) -- the C++/RobotState STORAGE stays a full 8-bit
  // counter (Decision 6's own "an 8-bit wrap-around counter suffices"),
  // this only narrows the varint width the SIZE TABLE assumes (127 fits
  // one varint byte; 128-255 would cost a 2nd, non-fatal, exactly the
  // established "size table under-estimates a rare case" precedent).
  uint32 position_epoch = 4 [(max) = 127];
}

// Everything the OTOS supplies in one burst read: position, heading, AND
// the measured velocities (previously read by the driver and dropped),
// stamped with the burst's own read time. Packed fixed-point on the wire
// (124-008, issue §B3): x/y at 1mm scale, heading at 1mrad scale, v_x/v_y
// at 0.1mm/s scale, omega at 0.01rad/s scale.
message OtosReading {
  sint32 x       = 1 [(scale) = 1.0, (abs_max) = 32000];    // [mm]
  sint32 y       = 2 [(scale) = 1.0, (abs_max) = 32000];    // [mm]
  sint32 heading = 3 [(scale) = 0.001, (abs_max) = 3142];   // [rad]
  sint32 v_x     = 4 [(scale) = 0.1, (abs_max) = 4000];     // [mm/s]
  sint32 v_y     = 5 [(scale) = 0.1, (abs_max) = 4000];     // [mm/s]
  sint32 omega   = 6 [(scale) = 0.01, (abs_max) = 1000];    // [rad/s]
  uint32 age     = 7 [(max) = 255];  // [ms] see EncoderReading.age's own doc comment -- same rename/rationale
}

// AckEntry -- DELETED (124-008, issue §B4): `repeated AckEntry acks` cost a
// tag AND a length prefix per element (8B x 4 = 32B, the frame's single
// largest line). Telemetry.acks below is now `repeated uint32`, PACKED,
// each element `corr_id<<4 | err` -- one tag + one length + four varints
// (14B worst case). corr_id needs 16 bits, err needs 4 (ErrCode's own
// enumerator span tops out at ERR_NOT_CONFIGURED=8). Field numbers 1/2
// (corr_id/err) were this message's own, not shared with any other
// message -- nothing to reserve.

message Telemetry {
  // now's (max) (124-008, issue §B5's own size-accounting table -- needed
  // to hit the ≤130B gate): a SIZING bound, not a hard wire limit -- same
  // established precedent as cycle_busy/cycle_period below ("(max)
  // reflects the realistic diagnostic range, not a hard wire limit").
  // validateBounds() runs on DECODE only, never encode (wire.cpp's own
  // decodeInto()/encodeInto() split -- the exact asymmetry B6 is about);
  // Telemetry is firmware-ENCODE-only (there is no decode(Telemetry&,...)
  // in production code, only a 124-008 test-only addition), so this bound
  // is NEVER evaluated against a real value at runtime -- exceeding it
  // costs a few extra encoded bytes on an unusually long session, nothing
  // is ever rejected, clamped, or truncated.
  uint32    now  = 1 [(max) = 2097151];  // [ms] robot clock at frame assembly -- always present
  // seq wraps (124-008, same rationale as now's bound just above): a
  // wrapping per-frame counter used only for host-side drop/reorder
  // detection stays useful at a small wrap window given the host reads
  // faster than the wrap period -- narrows the worst-case varint width
  // from 5B (unbounded uint32) to 2B.
  uint32    seq  = 2 [(max) = 127];  // always present, wraps
  DriveMode mode = 3;  // always present

  // flags -- THE bit string: status + faults + events, one field. Every
  // bool/bitmask the 103-era frame carried separately (has_*/active/
  // conn_left/conn_right/otos_connected/fault_bits/event_bits) lives here.
  //   bit 0  -- otos_present    (OtosReading fresh this frame)
  //   bit 1  -- otos_connected
  //   bit 2  -- active          (motion in progress)
  //   bit 3  -- conn_left       (left motor bus connectivity)
  //   bit 4  -- conn_right      (right motor bus connectivity)
  //   bit 5  -- RESERVED (formerly ack_fresh -- 124-008 deleted the single
  //             "freshest ack" scalar slot (ack_corr/ack_err) this bit
  //             gated; ring membership in acks below already means
  //             "really acked," so no freshness bit is needed any more)
  //   bit 6  -- fault: I2C clearance safety-net trip (known benign boot
  //             one-shot -- see the pre-rewrite frame's own bit-0 comment
  //             history for the full characterization; a healthy robot can
  //             show this bit permanently set after boot with no ongoing
  //             problem -- only a bit that flips DURING driving, not just
  //             at boot, is actionable)
  //   bit 7  -- fault: wedge latch detected
  //   bit 8  -- fault: I2C NAK/timeout
  //   bit 9  -- fault: malformed inbound frame seen
  //   bit 10 -- event: deadman expired (transition cycle)
  //   bit 11 -- event: boot ready (transition cycle)
  //   bit 12 -- event: config delta applied (transition cycle)
  //   bit 13 -- line_present    (line word fresh)
  //   bit 14 -- color_present   (color word fresh)
  //   bit 15 -- fault: MOVE timeout backstop fired (declared now, wired by
  //             sprint 116's protocol-set-point issue -- S1 does not flip
  //             this bit, S1 has no MOVE command to time out)
  //   bit 16 -- fault: MOVE active AND shaping disabled on both axes
  //             (App::MoveQueue::shapingDisabled()) -- see
  //             kFlagFaultShapingDisabled's own doc comment, telemetry.h.
  //   bit 17 -- fault: position-rebaseline defensive clamp fired (124-008,
  //             Decision 6's "bound-exceeded fallback") -- a wheel's
  //             position was clamped to EncoderReading.position's own
  //             (abs_max) at the encode step rather than allowed to wrap.
  //             Not the expected path (RobotLoop's own per-cycle
  //             rebaseline trigger, at a 2000mm margin below the bound,
  //             should prevent this in normal operation) -- purely
  //             observable evidence the defensive fallback engaged.
  //   bit 18 -- fault: an inbound command was dropped because App::Comms's
  //             command ring was full (App::Comms::commandsDroppedCount()
  //             > 0 -- command-ingestion-...-two-stops.md §1). Distinct in
  //             KIND from bit 9: bit 9 is a wire/link problem (a line
  //             arrived corrupt), this is firmware backpressure (a
  //             well-formed command arrived faster than one cycle's drain
  //             could route it). Latching, like every other fault count
  //             bit here -- it says "this has happened since boot," not
  //             "this is happening now."
  //   bits 19-31 reserved
  //
  // (max)=524287 ((1<<19)-1) -- widened by command-ingestion-...-two-stops.md
  // to cover bit 18 above, the same way 124-008 widened it for bits 16/17
  // (see that note below). Same discipline: the bound tracks the highest
  // LIVE bit, and validateBounds() runs on decode only, so an unwidened
  // bound is a silent decode-side rejection waiting to happen.
  //
  // (max)=262143 ((1<<18)-1) -- 124-008 (issue §B6): this bound was
  // 65535 (16 bits) while kFlagFaultShapingDisabled (bit 16, added a prior
  // sprint) had already pushed a real value to 65536 -- a live defect,
  // silent because validateBounds() runs on decode only, never encode (see
  // wire.cpp's own decodeInto()/encodeInto() split). Widened to cover both
  // bit 16 and this ticket's own new bit 17.
  uint32 flags = 4 [(max) = 524287];

  // ack_corr/ack_err -- DELETED (124-008, issue §B4): the single "freshest
  // ack" scalar slot duplicated the ack ring's (acks, below) newest entry;
  // ring membership already means "really acked," so the separate
  // freshness bit (flags bit 5, kFlagAckFresh) these fields needed is gone
  // too -- bit 5 is now reserved documentation, not a live bit. Field
  // numbers 5/6 are RESERVED, not reused (this project's standing "no
  // silent field-number reuse" discipline for a message with a real,
  // actively-bench-tested consumer).
  reserved 5, 6;
  reserved "ack_corr", "ack_err";

  // Sensors and encoders.
  EncoderReading enc_left  = 7;
  EncoderReading enc_right = 8;
  OtosReading    otos      = 9;   // valid iff flags bit 0 (otos_present)
  Pose2D         pose      = 10;  // encoder-odometry integrated pose, always present
  BodyTwist3     twist     = 11;  // body twist from measured wheel velocities, always present

  // Packed sensor words. Valid iff flags bits 13/14 respectively.
  uint32 line  = 12;  // 4 line channels, one byte each (ch1 in the low byte)
  uint32 color = 13;  // color sensor RGBC, 8 bits per channel (R in the low byte)

  // Bounded ack ring (120, ADDITIVE -- new field, next free number after
  // 115-003's clean renumber; nothing above is renumbered or removed).
  // Carries the last kAckRingDepth (4) ack pushes since Telemetry was
  // constructed, oldest evicted first on overflow -- so a host reading at
  // ~15Hz against this frame's ~25Hz emit rate still observes a transient
  // enqueue/STOP/CONFIG ack that the old single ack_corr/ack_err slot
  // would have lost to a same-primary-period overwrite
  // (bench-single-ack-slot-observability-collapses-at-40ms.md). Every
  // entry here was genuinely pushed via App::Telemetry::ack() -- ring
  // membership already means "really acked," no separate freshness bit
  // applies. A push past depth 4 evicts the OLDEST entry, not this one;
  // see src/firm/app/DESIGN.md's "Telemetry's ack ring" note.
  //
  // PACKED (124-008, issue §B4): was `repeated AckEntry` (a 2-field
  // message per element -- tag+length-delimited PER element, 8B x 4 =
  // 32B, the frame's single largest line before this change). Each
  // element is now one packed uint32: `corr_id<<4 | err` -- corr_id needs
  // 16 bits (CommandEnvelope.corr_id/Move.id, (max)=65535 as AckEntry's
  // own field used to declare), err needs 4 (ErrCode's own enumerator
  // span tops out at ERR_NOT_CONFIGURED=8, not the 7 AckEntry.err used to
  // declare -- also fixed here, issue §B6). One tag + one length + four
  // varints = 14B worst case -- the engine's `FieldKind::kRepeatedScalar`
  // (wire.cpp), declared "PACKED on the wire" since the M4 codec landed
  // but never exercised by any schema field until this one.
  // (max)=1048575 ((65535<<4)|15, the packed word's own true ceiling --
  // corr_id maxed at 16 bits, err maxed at 4 bits) narrows each packed
  // element's worst-case varint width from 5B (unbounded uint32) to 3B --
  // this bound is not enforced at runtime (packed-scalar elements are not
  // individually bounds-checked by decodeInto()'s kRepeatedScalar case,
  // same as every other repeated field in this schema), purely a size-
  // accounting fact the generator can prove from the schema.
  // DEPTH 4 -> 12 (command-ingestion-ring-buffered-comms-subsystem-routing-
  // two-stops.md §1): with App::Comms's command ring, RobotLoop drains the
  // WHOLE ring in one cycle, so N commands ingested across a cycle push N
  // acks into this ring within a single frame. At depth 4 a 5-command
  // burst -- well inside the ring's own depth -- would execute correctly
  // but lose an ack, and a host chaining on completion acks would hang on
  // a command that really did run. The two depths are kept EQUAL to
  // App::kCmdRingDepth (comms.h) for exactly that reason; see also
  // src/host/robot_radio/robot/protocol.py's own ring-survival note, which
  // documented the old depth-4 margin.
  repeated uint32 acks = 14 [(max_count) = 12, (max) = 1048575];

  // 123-004 (MIGRATED from TelemetrySecondary's fields 11/12, ADDITIVE here
  // -- next free numbers after 120's acks=14; nothing above is renumbered):
  // loop-timing diagnostics, now staged onto THIS per-cycle frame every
  // cycle instead of TelemetrySecondary's ~5Hz sample (122-003's interim
  // placement -- see that message's own doc comment for the full history
  // of why it started there and what unblocked the move). Bounded to the
  // tens-of-thousands-of-microseconds range (a pathological multi-second
  // stall would saturate, not overflow, this field -- (max) reflects the
  // realistic diagnostic range, not a hard wire limit). Unblocked by
  // 123-001/123-002's COBS+CRC framing rework, which removed the base64
  // armor's 33% expansion and recomputed the envelope budget to 240B (was
  // 186B) -- see wire.h's own kEnvelopeBudgetBytes derivation comment.
  uint32 cycle_busy   = 15 [(max) = 200000];  // [us] cycleStart -> frame-staging instant, THIS cycle
  uint32 cycle_period = 16 [(max) = 200000];  // [us] this cycle's cycleStart minus the previous cycle's
}

// TelemetrySecondary -- DELETED (124-009, robot-state-blackboard-...md,
// issue's own "Telemetry is a lean projection -- and TelemetrySecondary
// dies"). It emitted nothing but `now` in production (no firmware caller
// ever populated has_cmd_vel/acc_*/glitch_*/ts_* -- see this message's own
// pre-deletion doc comment history for why: cmd_vel/acc/glitch were
// declared-but-never-wired since 103-001, and ts_left/ts_right had been
// redundant with EncoderReading.age since 124-008 anyway). `state ⊇ wire`
// (the blackboard issue's own framing) means there is no wire-visibility
// invariant obligating any of its fields to fold into the primary frame:
// the host's own protocol.py documents its `cmd_vel` field as "permanent
// gap, TelemetrySecondary only" -- i.e. never actually wired off the wire
// even while this message existed. Nothing survives. Field numbers 1-10
// were this message's own, not shared with any other message -- nothing
// to reserve (the whole message is gone, not one field within a
// surviving message).
