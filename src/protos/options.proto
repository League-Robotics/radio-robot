syntax = "proto3";

package robot;

import "google/protobuf/descriptor.proto";

// Custom field options for robot message schemas.
//
// (units)     — string metadata describing physical units of a field
//               (e.g., "mm/s^2", "rad/s"). Informational only; not used at runtime.
// (max_count) — declares the maximum number of elements in a repeated field.
//               Used by gen_messages.py to emit fixed-capacity C++ arrays.
// (min)       — inclusive lower bound. Validated by the generated binary-wire
//               decoder (095, ticket 004); informational only until then.
// (max)       — inclusive upper bound. Same status as (min).
// (abs_max)   — |v| <= abs_max (speed/twist idiom) -- a symmetric bound
//               without having to spell out (min)=-N/(max)=N separately.
//               Same generated-validator status as (min)/(max).
// (req)       — field must be present on the wire (binary decode fails the
//               command if absent). Same generated-validator status as
//               (min)/(max)/(abs_max).
// (str_len)   — overrides gen_messages.py's default `char[64]` width for a
//               `string` field. Added 095-005 (Step 0b), scoped to this one
//               need (shrinking DeviceId's three strings to fit the 186-byte
//               envelope budget) rather than a general per-field-width
//               scheme — do not extend this option's meaning beyond string
//               capacity without revisiting its scope.
// (scale)     — GENERATED fixed-point divisor for a `sint32` field (sprint
//               124 ticket 008, issue protocol-v5-...md §B3/Decision 3).
//               Unlike (units) above, this is NOT informational-only:
//               gen_messages.py reads it and emits, on the generated C++
//               struct, a `static constexpr float k<Field>Scale` constant
//               plus `pack<Field>(float) -> int32_t` / `unpack<Field>
//               (int32_t) -> float` conversion methods -- the schema is the
//               ONE place the divisor is written; both firmware (these
//               generated methods) and host (the same extension, readable
//               off the compiled descriptor at runtime -- host uses real
//               protobuf, sint32 zigzag decode is automatic) derive from
//               it, so a mismatch between "what firmware encoded with" and
//               "what a reader divides back out by" cannot arise from two
//               independently hand-typed literals drifting apart. Real
//               value = raw * scale (e.g. scale=0.001 for a field whose
//               wire quantum is 1 mrad, stored in radians in memory).
//               Meaningful only on a `sint32` field; gen_messages.py raises
//               if found on any other field type.

extend google.protobuf.FieldOptions {
  optional string units     = 50000;
  optional uint32 max_count = 50001;
  optional double min       = 50002;
  optional double max       = 50003;
  optional double abs_max   = 50004;
  optional bool   req       = 50005;
  optional uint32 str_len   = 50006;
  optional double scale     = 50007;
}

// Custom enum-VALUE option for the command-name registry (124-001, sprint
// 124 architecture Decision 2 — commands.proto's `Verb` enum).
//
// (binary) — true: this verb's wire <data> is a binary, COBS+CRC-framed
//            payload (decoded through the existing CommandEnvelope/
//            ReplyEnvelope schema). false/absent (the proto3 default):
//            this verb's <data> is cleartext ASCII, hand-parsed, or the
//            verb carries no data at all. This is the SOLE text-vs-binary
//            discriminator under protocol v5 — see commands.proto's own
//            header comment.
//
// A separate extend block (not folded into the FieldOptions block above):
// FieldOptions and EnumValueOptions are different extended message types,
// so their extension field numbers occupy independent number spaces —
// starting this block at 50100 (rather than continuing 50007) keeps that
// distinction visible at a glance rather than implying a shared sequence.
extend google.protobuf.EnumValueOptions {
  optional bool binary = 50100;
}

// Custom message option for config GROUP messages (132-001, sprint 132
// "configuration discipline" -- robot_config.proto).
//
// (host_only) — true: this config group message (Identity/Connection/
//               Vision) is host-only -- it exists purely for the host's
//               own generated pydantic model / JSON Schema (gen_messages.py's
//               ticket-002 emission modes), never generates a C++
//               Config::Robot group member, never gets a wire codec, and
//               carries no ConfigGroupTarget enum value. False/absent (the
//               proto3 default): an ordinary robot-config group --
//               gen_messages.py emits BOTH a C++ Config::Robot member and a
//               wire codec for it, and it carries a matching
//               ConfigGroupTarget enum value (robot_config.proto's own
//               naming convention: group message name == enum value name,
//               e.g. message Geometry <-> ConfigGroupTarget.GEOMETRY).
//
// A separate extend block (not folded into the FieldOptions block above):
// FieldOptions and MessageOptions are different extended message types, so
// their extension field numbers occupy independent number spaces --
// starting this block at 50200 (rather than continuing 50007 or 50100)
// keeps that distinction visible at a glance, the same reasoning the
// EnumValueOptions block above already gives for its own 50100 start.
extend google.protobuf.MessageOptions {
  optional bool host_only = 50200;
}
