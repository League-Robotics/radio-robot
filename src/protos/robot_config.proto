// ===========================================================================
// Host-only groups -- never generate a C++ Config::Robot member, never cross
// the wire, carry no ConfigGroupTarget value (`(host_only) = true`, below).
// Exist purely so the host's generated pydantic model / JSON Schema
// (gen_messages.py's ticket-002 emission modes) can represent the WHOLE
// robot JSON file, not just its wire-addressable slice.
// ===========================================================================

// Identity -- robot name/uid/hardware model, plus the compile-time
// drivetrain-type string (`identity.drivetrain_type`, gen_boot_config.py's
// drivetrain_type_for_config(), soft `_get()` defaulting to
// "differential") that feeds Config::kDrivetrainType (the `ID:` reply's own
// drivetrain-type field) -- host-only despite being read by the generator,
// because it becomes a compile-time C string constant, never a live
// Config::Robot member.
message Identity {
  option (host_only) = true;

  string robot_name       = 1;
  string uid              = 2;
  string hardware_model   = 3;
  string common_name      = 4;
  string drivetrain_type  = 5;  // "differential" | "mecanum"; default "differential"
}

// Connection -- how the host reaches this robot (never read by
// gen_boot_config.py; host-tooling identity only).
message Connection {
  option (host_only) = true;

  string device_announcement_name = 1;
  string serial_last_6             = 2;

  // Radio channel (nRF frequency band, 0..83; group is fixed at 10 to match
  // the RadioRelay -- com/radio.h). BAKE-ONLY by design, not a wire target:
  // re-tuning a live link drops it (Radio::setChannel()'s own note), and the
  // point of the field is that two robots sharing a bench NEVER share a
  // channel unintentionally (2026-08-05: gopiv on tovez's channel 0 joined a
  // cross-reply storm; the only prior way to move it was an uncommitted
  // main.cpp literal). gen_boot_config.py emits Config::kRadioChannel from
  // this field; main.cpp passes it to Radio::begin(). Absent field = proto3
  // zero = channel 0, the historical hard-coded value -- every existing
  // robot JSON keeps its behavior without an edit.
  uint32 radio_channel = 3;  // [nRF frequency band]

  // Fixed IPv4 address for the Planet X WiFi module (Ai-Thinker Ai-WB2-12F)
  // when this robot carries one. The bench DNS resolves each robot's name to
  // its reserved address (2026-08-08: gopiv=192.168.4.10, tovez=192.168.4.11);
  // this field records that reservation so config, not a session transcript,
  // is the source of truth. The module learns everything else about the
  // network (gateway, netmask) from DHCP and takes ONLY the address itself
  // from here (stakeholder directive 2026-08-08). Absent/empty = this robot
  // has no WiFi module, or runs it DHCP-only: every consumer MUST no-op --
  // the module is an optional peripheral, not part of the base robot. First
  // consumer: src/tests/bench/wifi/wifi_setup.py.
  string wifi_ip = 4;
}

// Vision -- the overhead-camera AprilTag mount this robot answers to (never
// read by gen_boot_config.py; playfield-tooling identity only).
message Vision {
  option (host_only) = true;

  uint32 robot_tag_id          = 1;
  float  tag_offset_x          = 2;  // [mm]
  float  tag_offset_y          = 3;  // [mm]
  float  tag_offset_z          = 4;  // [mm]
  float  tag_offset_yaw        = 5;  // [rad]
  float  camera_distance_scale = 6;
}

// ===========================================================================
// ConfigGroupTarget -- which robot-config group a whole-group SET/GET or a
// single-field SET/GET addresses. One value per robot-config group below
// (by construction: group message name == enum value name, upper-cased with
// underscores at word boundaries -- e.g. message WheelControl <->
// WHEEL_CONTROL). Host-only groups (Identity/Connection/Vision above) have
// no value here -- they are never wire-addressable.
// ===========================================================================
enum ConfigGroupTarget {
  CONFIG_GROUP_UNSPECIFIED = 0;  // proto3-required zero value; never a real target
  GEOMETRY       = 1;
  MOTORS         = 2;
  DRIVE          = 3;
  WHEEL_CONTROL  = 4;
  PLANNER        = 5;
  OTOS           = 6;
  ESTIMATOR      = 7;
  // PLANNER_SHAPER -- added 132-017 (JSON reshape ticket, stakeholder-
  // sanctioned mid-sprint split, 2026-08-04): the six shaper ceilings
  // (Planner.a_max/a_decel/alpha_max/alpha_decel/jerk_max/yaw_jerk_max, as
  // this file originally declared them) split OUT of PLANNER into their
  // own live target. See the PlannerShaper message's own header comment
  // below for the full rationale.
  PLANNER_SHAPER = 8;
  // NAVIGATOR -- added 135-004 (sprint 135, "GO_TO navigator in the motion
  // library"): Motion::NavigatorLimits (src/motion/navigator/arc_solver.h)
  // sourced through the same runtime push path and bake path every other
  // group already uses. See the Navigator message's own header comment
  // below.
  NAVIGATOR = 9;
}

// ConfigSource -- 133-006 (A-live-config-push-is-wiped-by-the-next-reconnect.md,
// "per-group config provenance, reported on the reply"): where the values a
// group is CURRENTLY running came from. Reported per group on the
// `ConfigSnapshot` reply below -- deliberately NOT a field of any group
// message above.
//
// WHY NOT A GROUP FIELD: every group message here also generates the host
// pydantic model AND `data/robots/robot_config.schema.json` (gen_messages.py's
// `_robot_config_groups()`), so a `source` field inside a group would land in
// the robot JSON -- and a FILE can never carry a runtime-assigned value, which
// breaks sprint 132's headline read-back-equals-file property. Provenance is a
// property of the ANSWER, not of the configuration, so it rides the reply
// envelope. `_CONFIG_ENVELOPE_MESSAGE_NAMES` already excludes ConfigSnapshot
// from both group-emission modes, so this placement is enforced structurally
// rather than by convention.
//
// WHY PER-GROUP AND NOT ONE GLOBAL FLAG: config is seven groups and DRIVE may
// be LIVE while PLANNER is still BAKED -- a single flag would have to lie about
// one of them.
//
// Value names are prefixed because protoc scopes every enum VALUE name to the
// whole `robot` package (see ConfigGroupTarget's own NAMING NOTE above); a bare
// `LIVE`/`BAKED` would be a package-wide claim on those words.
enum ConfigSource {
  // Never reported by a real reply: proto3's required zero value, which
  // doubles as the "this build predates provenance" reading for a host talking
  // to older firmware (proto3 implicit presence omits a zero-valued field from
  // the wire entirely).
  CONFIG_SOURCE_UNSPECIFIED = 0;

  // The generated, robot-JSON-baked `Config::default*Group()` values --
  // `Configurator::loadBaked()`. Every group starts here at boot.
  CONFIG_SOURCE_BAKED = 1;

  // A live wire push landed on this group in the CURRENT power cycle --
  // `Configurator::applyGroup()`/`applyField()`.
  //
  // SCOPE, and it is a narrow one: DRIVE and PLANNER_SHAPER are not persisted
  // to flash (see configurator.h's PERSISTENCE SCOPE note), so for those groups
  // LIVE survives only while the robot stays powered. After a power cycle they
  // read BAKED by definition. This answers "is the robot running what I pushed"
  // during a tuning session; it is not, and cannot be, a claim about surviving
  // a power cycle.
  CONFIG_SOURCE_LIVE = 2;

  // Restored at boot from the flash-persisted tuning snapshot --
  // `Configurator::reapplyPersistedTuning()`, reachable only for the three
  // persisted groups (WHEEL_CONTROL / MOTORS.travel_calib / OTOS).
  //
  // This value exists because a flash-restored group came from NEITHER the
  // baked file NOR a push in this session, and reporting it as BAKED would be a
  // fresh instance of exactly the dishonesty this enum was added to remove --
  // a robot running tuned values while the read-back claims it is running the
  // file's. A later live push on the same group overwrites this with LIVE.
  CONFIG_SOURCE_PERSISTED = 3;
}

// ===========================================================================
// Robot-config groups -- each generates a C++ Config::Robot member AND a
// wire codec (ticket 002); each carries the ConfigGroupTarget value of the
// same name above. Raw fields only, mirroring the robot JSON exactly (same
// fields, same units) -- no derived quantities stored (e.g. Geometry holds
// the raw `trackwidth`/`rotational_slip`, never the scrub-corrected
// effective track width Drive/Odometry actually use; that division is a
// Config::Robot METHOD, `effectiveTrackWidth()`, added by ticket 007 on the
// C++ struct this schema generates -- not a schema field).
// ===========================================================================

// Geometry -- physical trackwidth, scrub correction, and the affine turn
// (rotation) calibration. Consumed by RobotLoop's own "geometry/rotation"
// configure() (sprint.md Step 3 module list).
message Geometry {
  float trackwidth          = 1 [(min) = 1.0];  // [mm] caliper-measured wheel separation; must be positive
  // rotational_slip: scrub factor, actual/ideal rotation. Domain {0} u
  // [0.5, 1.0] (0 = uncalibrated sentinel, not divide-by-zero) -- a
  // non-contiguous domain no (min)/(max)/(abs_max) pair can express; left
  // unbounded here on purpose (see this file's own header checklist).
  float rotational_slip     = 2;
  // Affine turn-response calibration: actual = gain*commanded + offset,
  // per direction of commanded rotation (drivetrain.proto's own
  // DrivetrainConfig already names this exact field cluster identically).
  float rotation_gain_pos   = 3;
  float rotation_offset     = 4;  // [deg] positive-direction offset (see rotation_gain_pos)
  float rotation_gain_neg   = 5;
  float rotation_offset_neg = 6;  // [deg]
}

// Motors -- per-bound-motor (left/right drive pair) calibration and
// velocity-PID gains. Consumed by Devices::Motor (left AND right,
// independently) via Configurator::install(MOTORS).
message Motors {
  float travel_calib_left   = 1  [(min) = 0.0001];  // [mm/deg] must be positive
  float travel_calib_right  = 2  [(min) = 0.0001];  // [mm/deg]
  int32 fwd_sign_left       = 3  [(min) = -1, (max) = 1];  // +1 or -1
  int32 fwd_sign_right      = 4  [(min) = -1, (max) = 1];
  float output_deadband     = 5  [(abs_max) = 1.0];  // [-1,1] duty fraction
  float reversal_dwell      = 6  [(min) = 0.0];  // [ms] hold at commanded-zero on any sign change; 0 = legacy immediate-reversal
  float vel_kp              = 7  [(min) = 0.0];
  float vel_ki              = 8  [(min) = 0.0];
  float vel_kff             = 9  [(min) = 0.0];
  float vel_i_max           = 10 [(min) = 0.0];
  float vel_kaw             = 11 [(min) = 0.0];  // anti-windup back-calculation coefficient; 0 = off
  float vel_filt_alpha      = 12 [(min) = 0.0];  // EMA weight on the filtered velocity sample
}

// Drive -- App::Drive's open-loop wheel calibration and the per-wheel
// Stage-A commanded->actual correction (this sprint's headline feature,
// SUC-006). Consumed by App::Drive via Configurator::install(DRIVE).
message Drive {
  float duty_per_speed_left        = 1  [(min) = 0.0];  // [duty/(mm/s)] 1 / measured plant gain, left
  float duty_per_speed_right       = 2  [(min) = 0.0];  // [duty/(mm/s)] 1 / measured plant gain, right
  float crawl_pulse                = 3  [(abs_max) = 1.0];  // [-1,1] sub-breakaway pulse amplitude; 0 = off
  // Stage A: measured = gain*commanded + intercept, per wheel per direction
  // of approach (docs/design/wheel-speed-command-mapping.md). gain must be
  // positive -- App::Drive's correctedCommand() divides by it; gen_boot_
  // config.py's own wheel_correction_for_config() already aborts the build
  // if any gain <= 0.
  float wheel_gain_left_accel      = 4  [(min) = 0.0001];
  float wheel_intercept_left_accel = 5;   // [mm/s]
  float wheel_gain_left_decel      = 6  [(min) = 0.0001];
  float wheel_intercept_left_decel = 7;   // [mm/s]
  float wheel_gain_right_accel     = 8  [(min) = 0.0001];
  float wheel_intercept_right_accel = 9;  // [mm/s]
  float wheel_gain_right_decel     = 10 [(min) = 0.0001];
  float wheel_intercept_right_decel = 11; // [mm/s]
}

// WheelControl -- App::Drive's unified three-timescale wheel-speed
// controller: Stage B's wire-tunable fast-PID gains and Stage C/
// deficit-flag's bounds. Consumed by App::Drive via
// Configurator::install(WHEEL_CONTROL). Every field's "0 = disabled" is
// App::Drive's own documented convention (boot_config.h's
// WheelControllerBootConfig doc comment) -- a robot JSON may legitimately
// ship every one of these at 0 (both stages inert), so bounds below stay
// at an inclusive >= 0 floor, never a strict positive one.
message WheelControl {
  float v_min              = 1  [(min) = 0.0];  // [mm/s] speed floor
  float bias_max           = 2  [(min) = 0.0];  // [mm/s] Stage C trim authority clamp
  float tau_adapt          = 3  [(min) = 0.0];  // [s] Stage C adaptation time constant; <=0 disables
  float a_steady           = 4  [(min) = 0.0];  // [mm/s^2] steady-state gate
  float deficit_threshold  = 5  [(min) = 0.0];  // [mm/s] deficit-flag error threshold
  float deficit_window     = 6  [(min) = 0.0];  // [ms] deficit-flag sustain window
  float pid_kp             = 7  [(min) = 0.0];  // [1] dimensionless proportional gain
  float pid_ki             = 8  [(min) = 0.0];  // [1/s] integral gain
  float pid_i_max          = 9  [(min) = 0.0];  // [mm/s] I-term OUTPUT clamp (see pos_err_max)
  float pid_kaff           = 10 [(min) = 0.0];  // [s] accel feedforward
  float pid_max            = 11 [(min) = 0.0];  // [mm/s] total fast-loop authority clamp
  // pos_err_max -- 133-002. Stage B's I term is a POSITION term (App::Drive::
  // fastPid()/positionError(), drive.cpp): `integral = pid_ki * posError`,
  // with posError in MILLIMETRES read from the encoder's position register.
  //
  // pos_err_max and pid_i_max clamp DIFFERENT DOMAINS and BOTH are
  // load-bearing -- this pair is the whole point of the change, so do not
  // "simplify" one away:
  //   pos_err_max  [mm]    bounds the INPUT  -- position error, BEFORE pid_ki
  //   pid_i_max    [mm/s]  bounds the OUTPUT -- pid_ki * posError, AFTER it
  // Before 133-002 there was only pid_i_max, which -- because the accumulated
  // quantity was already millimetres -- acted as a DISGUISED position limit of
  // pid_i_max/pid_ki mm (at ki=6/iMax=20: 3.3 mm, smaller than every residual
  // being chased, so RAISING ki SHRANK the loop's position memory). Clamping
  // the input in millimetres is what lets pid_i_max be the honest velocity-
  // authority bound it was always named for.
  //
  // 0 = unclamped position error, matching this message's own "0 = disabled"
  // convention. Note pid_i_max's own 0 still means "the I term is off
  // entirely" (App::Drive::fastPid()'s fail-closed posture, unchanged from the
  // accumulator era) -- so a robot JSON shipping pid_i_max = 0 has no I term
  // regardless of what this field says.
  float pos_err_max        = 12 [(min) = 0.0];  // [mm] Stage B position-error clamp; 0 = unclamped

  // STALL DETECTION. A stall is the drivetrain being ASKED to move and not
  // moving: the robot is jammed -- against a rail, a wall, or the table edge.
  // It is a distinct fault from the two this message already describes, and
  // conflating them is why nothing caught the rail collisions:
  //
  //   deficit_*   the PID cannot MEET a speed it is partly achieving. Reports
  //               only; the wheel IS turning.
  //   wheelFrozen the ENCODER stopped reporting (Devices::Motor::wedgeSuspect).
  //               A sensor fault -- the wheel may well be spinning.
  //   stall_*     commanded speed is real, measured speed is ~zero, and the
  //               encoder is healthy enough to be believed. The wheel is
  //               physically held. THIS ONE STOPS THE ROBOT.
  //
  // The encoder-health precondition is load-bearing: without it a wedged
  // encoder reads as zero speed forever and would trip a false stall on a
  // perfectly free wheel. App::Drive gates on the same freshness test its
  // own PID already uses before trusting a reading.
  //
  // 0 on stall_window disables the detector entirely, matching this message's
  // "0 = disabled" convention. Disabling it means the robot will once again
  // grind against a rail until something else notices.
  float stall_speed        = 13 [(min) = 0.0];  // [mm/s] measured speed at or below this counts as not turning
  float stall_demand       = 14 [(min) = 0.0];  // [mm/s] commanded speed above this counts as genuinely asking for motion
  float stall_window       = 15 [(min) = 0.0];  // [ms] how long both must hold before the stall latches; 0 = detector off
}

// Planner -- Motion::Planner's BOOT-ONLY tuning surface: profile velocity/
// omega ceilings, loop timing, settle/rest, heading hold. Consumed by
// Motion::Planner via the boot-time-only Configurator::install() fan-out
// (no live per-target push -- GEOMETRY/PLANNER stay boot-only,
// configurator.cpp's isLiveConfigurable()).
//
// SPLIT, 132-017 (JSON reshape ticket, stakeholder-sanctioned mid-sprint
// scope addition, 2026-08-04): this message used to also carry the six
// shaper-ceiling fields (a_max/a_decel/alpha_max/alpha_decel/jerk_max/
// yaw_jerk_max) -- 132-014's own the-configuration-object.md audit found
// that folding them in here silently regressed them from genuinely LIVE
// (their own pre-132 wire arm) to permanently boot-only, because ONE
// coarse ConfigGroupTarget forces every field in it to share the SAME
// re-appliability verdict, and `Motion::Planner::applyShaperLimits()`
// already exists as one of the issue's own eight safely-re-appliable
// setters (the-configuration-object.md's "boot-only vs live" table) --
// only the REST of this message (v_max/omega_max/control_period/
// actuation_delay/settle_*/heading_hold_gain/decel_plan_fraction) has no
// post-construction setter at all and genuinely belongs boot-only. Field
// numbers 2/3/5/6/7/8 (the six moved-out shaper fields) are `reserved`
// below, not renumbered into the survivors -- this file's own
// non-contiguous-numbering precedent (see the already-reserved 17-22
// block this same message carried before this split) makes a low-churn,
// no-renumber split lower-risk than shifting every surviving field's own
// wire number. See the new PlannerShaper message immediately below for
// the live half.
message Planner {
  float  v_max                  = 1  [(min) = 0.0];  // [mm/s] linear velocity ceiling
  float  omega_max              = 4  [(min) = 0.0];  // [rad/s] angular velocity ceiling
  float  control_period          = 9  [(min) = 0.0];  // [ms]
  float  actuation_delay         = 10 [(min) = 0.0];  // [ms] command-staged-to-wheels latency
  float  settle_rest_velocity    = 11 [(min) = 0.0];  // [mm/s]
  float  settle_rest_omega       = 12 [(min) = 0.0];  // [rad/s]
  float  settle_epsilon_linear   = 13 [(min) = 0.0];  // [mm]
  float  settle_epsilon_angular  = 14 [(min) = 0.0];  // [rad]
  float  heading_hold_gain       = 15 [(min) = 0.0];  // [1/s] rad/s of correction per rad of error
  float  decel_plan_fraction     = 16 [(min) = 0.0];  // [1] fraction of decel ceiling to plan brake-start against

  // Terminal fine-align (134-003, docs/bench-reports/motion-planning-lab-
  // 2026-08-04.md §5.2/§3): the per-corner heading trim that took the
  // planner square tour from 25.8 mm to 9.4 mm of closure on `tovez` with
  // nothing else changed. `align_tol` is the residual (against the
  // cumulative-intent ledger) below which the Move stops trimming;
  // `align_max_nudges` bounds how many corrective pivots it may spend.
  //
  // BOOT-ONLY, like the rest of this message: `Motion::PlannerLimits::
  // Landing` has no post-construction setter, so retuning either value
  // needs a rebuild and reflash. Accepted deliberately (sprint 134 D3) --
  // §3 already swept the tolerance across 333 measured nudges and found
  // the operating point, and tightening it is measured counterproductive.
  //
  // align_tol is in RADIANS. The report states the operating point in
  // degrees (1.0 deg); every angular field in this group and in
  // PlannerLimits is radians, so the conversion happens ONCE, in the robot
  // JSON (1.0 deg == 0.017453 rad), and never again downstream.
  float  align_tol               = 23 [(min) = 0.0];  // [rad] fine-align residual tolerance
  int32  align_max_nudges        = 24 [(min) = 0.0];  // [1] corrective pivots per Move

  // a_max/a_decel/alpha_max/alpha_decel/jerk_max/yaw_jerk_max -- MOVED,
  // 132-017: now PlannerShaper's own fields 1-6 (below), a LIVE target.
  // shaper_a_max/shaper_a_decel/shaper_alpha_max/shaper_alpha_decel/
  // shaper_j_max/shaper_yaw_jerk_max -- DELETED, 132-015: these mirrored
  // Config::ShaperBootConfig (boot_config.h), itself confirmed to have
  // ZERO live consumers (Motion::Planner uses its own hand-baked
  // PlannerLimits, sourced from the LIVE planner.* fields above, not
  // this struct) and deleted the same ticket, alongside
  // gen_boot_config.py's shaper_config_for_config(). Reserved, not
  // reused (this file's own "split the group, don't grow this cap"
  // wire-stability discipline applies to field NUMBERS too, matching
  // envelope.proto/telemetry.proto's established "reserved, not
  // reused" convention elsewhere in this schema).
  reserved 2, 3, 5, 6, 7, 8, 17 to 22;
  reserved "a_max", "a_decel", "alpha_max", "alpha_decel", "jerk_max",
      "yaw_jerk_max", "shaper_a_max", "shaper_a_decel", "shaper_alpha_max",
      "shaper_alpha_decel", "shaper_j_max", "shaper_yaw_jerk_max";
}

// PlannerShaper -- Motion::Planner's LIVE shaper-ceiling surface, split out
// of Planner (132-017, above): the accel/decel/jerk profile ceilings
// `Motion::Planner::applyShaperLimits()` already knows how to re-apply at
// runtime (the-configuration-object.md's own re-appliability table lists
// it among the eight safely re-appliable setters). Consumed via
// Configurator::install(PLANNER_SHAPER) -- live, unlike Planner itself.
message PlannerShaper {
  float a_max        = 1 [(min) = 0.0];  // [mm/s^2] linear accel-ramp ceiling
  float a_decel      = 2 [(min) = 0.0];  // [mm/s^2] linear decel-taper ceiling
  float alpha_max    = 3 [(min) = 0.0];  // [rad/s^2] angular accel-ramp ceiling
  float alpha_decel  = 4 [(min) = 0.0];  // [rad/s^2] angular decel-taper ceiling
  float jerk_max     = 5 [(min) = 0.0];  // [mm/s^3] linear jerk ceiling
  float yaw_jerk_max = 6 [(min) = 0.0];  // [rad/s^3] angular jerk ceiling
}

// Navigator -- 135-004: Motion::NavigatorLimits (src/motion/navigator/
// arc_solver.h)'s own configuration group, following the Planner/
// PlannerShaper pattern above exactly. Consumed by Motion::Navigator via
// Configurator::install(NAVIGATOR) -- LIVE, matching PLANNER_SHAPER's own
// re-appliability (Motion::Navigator holds its NavigatorLimits by
// reference, per navigator.h's own design, so a live push here is visible
// to the very next tick() with no setter call at all -- see App::
// configureNavigator(), app/boot_calibration.h).
//
// `track_width` is deliberately NOT a field here -- NavigatorLimits::
// trackWidth is sourced from Config::Robot::effectiveTrackWidth() (the
// SAME scrub-corrected value Drive/Odometry/PlannerLimits already use),
// not duplicated as a second, independently-tunable copy of one physical
// fact (configuration-discipline.md: "one file, one truth").
message Navigator {
  float speed                      = 1 [(min) = 0.0];  // [mm/s] commanded forward body-frame cruise speed, far from target
  float max_wheel_step             = 2 [(min) = 0.0];  // [mm/s] curvature slew-clamp budget, per solve
  float behind_angle               = 3 [(min) = 0.0];  // [rad] target-behind guard cutoff
  float turn_first_angle           = 4 [(min) = 0.0];  // [rad] pivot-first threshold
  float approach_radius            = 5 [(min) = 0.0];  // [mm] near-target speed-taper radius; 0 = taper disabled
  float approach_speed             = 6 [(min) = 0.0];  // [mm/s] taper floor speed, reached at zero distance
  float default_arrival_tolerance  = 7 [(min) = 0.0];  // [mm] fallback when a goto's own tolerance is <= 0
  // yaw_sign -- 135-004 "Landmine 4": relates commanded Move::omega to
  // true-world CCW (Motion::NavigatorLimits::yawSign's own doc comment,
  // navigator.h, has the full derivation). +1.0 (default): no correction.
  // -1.0: this robot's commanded Move::omega is measured OPPOSITE
  // true-world CCW (matches src/tests/bench/goto_otos.py's own YAW_SIGN)
  // -- set from a real bench pass (ticket 006), never guessed. Left
  // unbounded ((min)/(max) would both reject the other legal value) --
  // the domain is exactly {-1.0, 1.0}, enforced by convention (this
  // comment and ticket 006's bench measurement), not a schema bound.
  float yaw_sign                   = 8;
}

// Otos -- SparkFun OTOS mounting lever-arm offset and chip scale
// multipliers. Consumed by Devices::Otos via Configurator::install(OTOS).
// `linear_scale`/`angular_scale` here are the config MULTIPLIER domain
// (1.0 = no correction), the same domain boot_config.h's OtosBootConfig
// already uses -- Devices::RealOtos::begin() converts this multiplier
// through Devices::scaleToRegister() (otos.h) before calling
// setLinearScalar()/setAngularScalar() (which take the chip's raw int8
// register value directly). The LIVE wire push path (App::configureOtos(),
// app/boot_calibration.cpp) applies that SAME conversion (132-010, trap 3
// of sprint.md, closed) -- a live push and a boot bake now agree on what a
// given multiplier means.
message Otos {
  float offset_x     = 1;  // [mm] mounting offset from chassis centre to sensor
  float offset_y     = 2;  // [mm]
  float offset_yaw   = 3;  // [rad] mounting yaw offset
  float linear_scale  = 4 [(min) = 0.0001];   // multiplier; 1.0 = no correction; must be positive
  float angular_scale = 5 [(min) = 0.0001];   // multiplier; 1.0 = no correction; must be positive
}

// Estimator -- complementary-blend fusion weights. NO LIVE CONSUMER as of
// 132-010 (trap 2, sprint.md, closed by making this permanent and
// explicit, not by inventing one): `App::StateEstimator` was deleted
// outright as dead code (sprint 128 ticket 016), and its one candidate
// successor, `Motion::PoseTracker::blendHeading()`, had its only call site
// deleted outright by 130-009 pending a from-scratch fusion redesign
// (clasi/issues/later/estimator-v2-otos-fusion-sim-first.md).
// `Configurator::install(ESTIMATOR)` decodes this group (read-back stays
// honest) but permanently returns `ERR_UNIMPLEMENTED` -- there is nothing
// to fan it out to until an estimator-v2 ticket exists.
message Estimator {
  float  weight_heading_otos = 1 [(min) = 0.0, (max) = 1.0];  // blend weight: body heading vs OTOS heading
  float  weight_omega_otos   = 2 [(min) = 0.0, (max) = 1.0];  // blend weight: body omega vs OTOS omega
  uint32 staleness            = 3;  // [ms] max OTOS reading age still eligible to blend
}

// ===========================================================================
// Wire envelope messages this schema drives -- the CONFIG binary arm's new
// internal shape (sprint.md Step 3/Step 4). Per-group payload bodies are
// placeholder `bytes` here: the generated group struct (ticket 002) IS the
// per-group message, so the envelope itself does not need to know any
// group's internal field shape, only which target it addresses and how
// many bytes its encoded body is -- this ticket declares that envelope
// shape only; ticket 002 (codegen) and ticket 008/009/012 (firmware
// dispatch) decide the generated C++ representation of `bytes` under the
// CODAL/no-heap constraint (a fixed-capacity array, most likely sized
// against the same kEncodeScratchCap=220 ceiling wire.cpp already
// documents -- not decided here).
//
// The 240 B envelope cannot carry Config::Robot's whole ~590 B field set in
// one frame (sprint.md Design Rationale Decision 3) -- every op below is
// necessarily per-ConfigGroupTarget, never per-object; a host aggregates a
// full read-back by iterating every target's own GetConfig/ConfigSnapshot.
//
// TICKET 002's OWN CALL -- `body`'s `(max_count)`: gen_messages.py's
// existing `bytes`-field emission (095-005) already turns an unsized
// `bytes` field into a fixed `uint8_t body_[64]` + `uint8_t body_count`
// with a stderr WARNING, so this was never a blocking gap -- but 64 is
// too small for the largest live robot-config group (measured via
// gen_messages.py's own `_worst_case_message_size()`, 2026-08-03: Planner
// is the worst case at 117 B of encoded content, against Motors=72,
// Drive=55, WheelControl=55, Geometry=30, Otos=25, Estimator=16). Sizing
// `(max_count)` at 220 tied `body`'s own capacity directly to
// `kEncodeScratchCap` (wire.cpp:684) -- a DIFFERENT ceiling (the generic
// nested-message-encode scratch buffer), not any requirement about how
// large a config group actually is -- and left `kFramedMaxBytes`'s own
// static_assert margin down to 1 byte (132-015, wire-budget emergency).
//
// UPDATE, 132-015 -- re-sized to 140, NOT 220: the stakeholder explicitly
// unblocked shrinking this (2026-08-04): "I don't think readback really
// has to be all one object. I don't think there is any big deal with
// there being multiple configuration messages per subsystem or per some
// other logical group." `(max_count)` is now sized to the real largest
// group PLUS modest headroom (Planner's 117 B measured above + ~23 B at
// the time this cap was picked; the SAME ticket's own dead-code sweep
// then deleted Planner's 6 dead `shaper_*` fields, below, dropping its
// real worst case further to 81 B -- Motors, at 72 B, is now the largest
// group -- so this cap's actual headroom is wider still, ~59 B, than the
// figure it was originally picked against), not to `kEncodeScratchCap`.
// THE RULE, going forward: if any group ever
// outgrows 140 B, the sanctioned move is to SPLIT THE GROUP into two
// smaller `ConfigGroupTarget` values, not to grow this cap back up --
// growing it back toward 220/240 reopens the exact margin emergency this
// ticket closed. (132-011 wires GetConfig/ConfigSnapshot below into
// CommandEnvelope.cmd/ReplyEnvelope.body -- envelope.proto's own
// `get_config`/`cfg` arms -- proving `(max_count)` fits the 240 B
// `_ENVELOPE_BUDGET_BYTES` static_assert with the reply's own non-oneof
// bytes still inside it: see wire.h's generated size-report comment for
// the exact measured total. SetConfigGroup/SetConfigField remain UNWIRED
// as of 132-011 -- that is ticket 012/013's job, not this one; GET is not
// gated behind SET landing first. UPDATE, 132-012: SetConfigField is now
// wired -- envelope.proto's own `set_field` arm (CommandEnvelope.cmd,
// field 25; see that arm's own doc comment for why the wire verb is the
// deliberately-shorter `SET_FIELD`, not a literal `SET_CONFIG_FIELD`
// mirror of this message's own name). SetConfigGroup remains ticket 013's
// job.)
//
// UPDATE, 132-017 -- Planner SPLIT into Planner (10 boot-only fields) +
// PlannerShaper (6 live fields), per this file's own PlannerShaper header
// comment above. This can only shrink the worst-case group further below
// Motors' 72 B (both halves of the former 81 B Planner are now smaller
// than Motors) -- `(max_count) = 140` is left at its 132-015 value rather
// than shrunk again in the same pass that also reshapes the JSON; see
// this ticket's own completion report for the freshly re-measured
// per-group sizes and envelope totals after this split and the
// regeneration it triggers.
// ===========================================================================

// SetConfigGroup -- push a whole group's worth of values in one frame.
// Firmware decodes `body` straight into Config::Robot's `target` member (no
// patch, no presence flags, no merge -- Configurator::applyGroup(target,
// wire, len)) and fans it out via install(target), which returns
// ERR_NOT_LIVE for a boot-only target rather than silently no-op'ing.
message SetConfigGroup {
  ConfigGroupTarget target = 1;
  bytes             body   = 2 [(max_count) = 140];  // encoded `target`'s own generated group message; see this file's header comment above -- split the group, don't grow this cap
}

// GetConfig -- request a read-back of one group. Wired into
// CommandEnvelope.cmd.get_config (envelope.proto, field 24) by 132-011 --
// NOT gated by isLiveConfigurable()/the applyGroup() re-appliability table:
// read-back works for every ConfigGroupTarget, including boot-only ones
// (GEOMETRY/PLANNER) -- only WRITES (applyGroup()/install(target)) are
// gated. `RobotLoop::routeCommand()`'s GET_CONFIG case reads
// `Configurator::config()`'s matching group, encodes it via the SAME
// generated per-group codec applyGroup()'s decode() counterpart already
// uses (`msg::wire::encode(<Group>&, ...)`, 132-011's own encode-direction
// addition to gen_messages.py's `_render_config_group_*` family), and
// replies with a ConfigSnapshot through `Comms::sendReply()` -- a genuinely
// synchronous per-command reply, unlike every other CONFIG-arm outcome
// (which rides the ack ring, §7.1 docs/protocol-v5.md).
message GetConfig {
  ConfigGroupTarget target = 1;
}

// ConfigSnapshot -- GetConfig's reply: the live, in-memory value of one
// group, encoded the same way SetConfigGroup.body is. Wired into
// ReplyEnvelope.body.cfg (envelope.proto, field 12) by 132-011.
message ConfigSnapshot {
  ConfigGroupTarget target = 1;
  bytes             body   = 2 [(max_count) = 140];  // see SetConfigGroup.body above -- split the group, don't grow this cap
  // source -- 133-006: where `body`'s values came from (see ConfigSource
  // above). Stamped by `Configurator::encodeSnapshot()` from the provenance
  // the two config_ mutation paths recorded; costs 2 B of the reply envelope
  // (1 B tag + 1 B varint) and the reply's worst case is `tlm`, not `cfg`, so
  // this does not move kReplyEnvelopeMaxEncodedSize at all.
  ConfigSource      source = 3;
}

// SetConfigField -- set exactly one field inside one group, addressed by
// (target, field number) -- the wire carries a NUMBER, never a string key.
// `field` is the target group's own generated protobuf field number (e.g.
// Drive.wheel_gain_left_decel's field number 4 above), looked up host-side
// via the real compiled descriptor (`Drive.DESCRIPTOR.fields_by_name[...]
// .number`) so a human still types a name and the wire still carries a
// number. Firmware's Configurator::applyField() reuses the SAME field-
// lookup/bounds-check table wire.cpp's decoder already builds for
// SetConfigGroup's own `target` (currently sealed in an anonymous
// namespace -- ticket 012 exposes it). `value` must be `isfinite` before
// `validateBounds()` runs: bounds compare with `<`/`>`, both false for NaN,
// so a NaN would otherwise pass every bound the fields above declare
// (ticket 012's own job, not solved by this schema).
//
// WIRED, 132-012: CommandEnvelope.cmd.set_field (envelope.proto, field
// 25) -- carries this message host->robot, dispatched by
// RobotLoop::routeCommand() to Configurator::applyField(), acked via the
// ack ring exactly like config/move/stop (never a synchronous reply, unlike
// GetConfig's own cfg arm). The arm/verb name is "set_field"/"SET_FIELD",
// not a literal "set_config_field"/"SET_CONFIG_FIELD" mirror of this
// message's own name -- see envelope.proto's own set_field arm doc comment
// for the wire-budget reasoning (GET_CONFIG's 10-byte verb name is already
// this schema's longest, driving comms.h's kMaxLineBytes to within 1 byte
// of SerialPort::kTxBufferCapacity; a 17-byte verb name would exceed it).
message SetConfigField {
  ConfigGroupTarget target = 1;
  uint32            field  = 2;
  float             value  = 3;
}
