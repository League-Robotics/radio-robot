//   - `geometry.drive_axle_offset_mm` (x/y), `geometry.
//     odometry_chip_upside_down`, `geometry.otos_untrusted`, `geometry.
//     wheelbase_mm`: none is read by any `_require()`/`_get()` call in
//     gen_boot_config.py today (confirmed by reading the file in full) --
//     dead data within an otherwise-live JSON section. Excluded from this
//     ticket's schema on the same "every field traces to an actual
//     _require() call site, not just a field count" discipline the
//     acceptance criteria set for the seven robot-config groups; may be
//     picked up by a later ticket (017's JSON reshape, or its own follow-up
//     issue) if a live consumer is ever found or added for them.
//   - ColorConfig/LineConfig are not declared at all (sprint.md Out of
//     Scope, ticket 001's own acceptance criterion) -- neither root has
