syntax = "proto3";

package robot;

import "options.proto";

// ---------------------------------------------------------------------------
// robot_config.proto -- the one schema (132-001, sprint 132 "configuration
// discipline: one owned object, live wire config with read-back, patch-
// surface retirement, JSON reshape, and per-wheel drive calibration").
//
// Declares `Config::Robot`'s complete END-STATE field set, authored directly
// in the end-state CONSUMER-GROUPED shape -- NOT today's 13-section robot
// JSON layout (clasi/sprints/132-.../sprint.md Design Rationale Decision 2).
// Three host-only groups (Identity/Connection/Vision, marked `(host_only)`,
// below) never cross the wire and never generate a C++ Config::Robot member;
// seven robot-config groups (Geometry/Motors/Drive/WheelControl/Planner/
// Otos/Estimator) each generate a C++ Config::Robot member AND a wire codec
// (ticket 002), and each carries a `ConfigGroupTarget` enum value.
//
// This file REPLACES config.proto's curated `*ConfigPatch` messages
// (`DrivetrainConfigPatch`/`MotorConfigPatch`/`OtosConfigPatch`/
// `EstimatorConfigPatch`) and their own `ConfigTarget`/`BoundMotorSide`
// enums -- config.proto itself is deleted wholesale by ticket 013 (patch-
// surface retirement), not by this ticket. Ticket 001's own scope is schema
// authorship only: it does not generate anything (ticket 002), does not
// touch the robot JSON files (ticket 017), and does not wire this schema
// into CommandEnvelope's own `cmd` oneof (a later ticket's job -- see
// envelope.proto's own `ConfigDelta`/`config` arm, untouched by this file).
//
// NAMING NOTE -- `ConfigGroupTarget`, not `ConfigTarget`: config.proto ALSO
// declares a top-level enum named `ConfigTarget` (with entirely different,
// PatchKind-shaped values -- CONFIG_DRIVETRAIN/CONFIG_MOTOR_LEFT/
// CONFIG_MOTOR_RIGHT/CONFIG_PLANNER/CONFIG_WATCHDOG/CONFIG_OTOS/
// CONFIG_ESTIMATOR). protoc treats every top-level enum TYPE name, and
// every enum VALUE name, as scoped to the whole `robot` package (C++
// enum-scoping rules -- confirmed empirically: two same-named top-level
// enums, or two enums with an overlapping bare value name, in files sharing
// one package fail to compile even when neither file imports the other).
// Sprint.md's own Problem section confirms config.proto's `ConfigTarget` is
// "declared and used nowhere in current firmware or host code" -- dead
// scaffolding -- but ticket 001's own file scope is `robot_config.proto`
// (create) and `options.proto` (add `(host_only)`) ONLY; deleting or
// renaming config.proto's enum is ticket 013's job (patch-surface
// retirement), not this ticket's. `ConfigGroupTarget` is this file's own
// non-colliding name for the SAME concept the sprint's own prose calls
// `ConfigTarget` throughout (sprint.md's Configurator/install()/applyGroup()
// pseudocode) -- ticket 013, once config.proto's own `ConfigTarget` is gone,
// is the natural point to rename this enum to the shorter `ConfigTarget`
// spelling if a later ticket wants that; not required by any acceptance
// criterion of this ticket.
//
// FIELD-BY-FIELD CHECKLIST against gen_boot_config.py's actual `_require()`
// (and, where noted, `_get()`) call sites -- src/scripts/gen_boot_config.py,
// verified 2026-08-03. Every REQUIRED field has a schema field below; the
// two soft (`_get()`, not `_require()`) per-port calibration functions are
// included too because sprint.md's own ticket-001 mapping text names them
// explicitly ("travel_calib/fwd_sign -> Motors"). Six fields are
// DELIBERATELY EXCLUDED, each flagged with its own rationale (mirrors this
// project's own "traceability gap, flagged not silently reconciled"
// discipline -- see config.proto's own header comment for the precedent):
//
//   otos_boot_config_values()      -> Otos.offset_x/offset_y/offset_yaw/
//                                      linear_scale/angular_scale
//     geometry.odometry_offset_mm.{x,y,yaw_rad}, calibration.
//     otos_linear_scale/otos_angular_scale -- 5 REQUIRED fields. Grouped
//     under Otos, not Geometry, per this ticket's own explicit mapping
//     ("OTOS scale/offset fields -> Otos") even though the JSON keys live
//     partly under `geometry.*` today (ticket 017's JSON reshape is what
//     actually moves the FILE's own section boundaries to match).
//   vel_gains_for_config()         -> Motors.vel_kp/vel_ki/vel_kff/
//                                      vel_i_max/vel_kaw/vel_filt_alpha
//     control.vel_kp/vel_ki/vel_kff/vel_imax/vel_kaw/vel_filt -- 6 REQUIRED
//     fields. Per-motor velocity-PID config, same consumer (Devices::Motor,
//     via Configurator::install(MOTORS)) as travel_calib/fwd_sign/deadband/
//     dwell below, so grouped with them under Motors.
//   output_deadband_for_config()   -> Motors.output_deadband
//     control.output_deadband -- 1 REQUIRED field.
//   reversal_dwell_for_config()    -> Motors.reversal_dwell
//     control.reversal_dwell_ms -- 1 REQUIRED field. JSON key carries a
//     "_ms" unit suffix; this schema's field does not (coding-standards.md
//     "no units in ANY identifier" -- this field doubles as the future
//     generated Config::Robot C++ member name, unlike config.proto's own
//     wire-only `*ConfigPatch` fields, which the coding-standards.md
//     wire-key exclusion covers; unit stays in the `// [ms]` comment tag).
//   trackwidth_for_config()        -> Geometry.trackwidth
//     geometry.trackwidth -- 1 REQUIRED field.
//   rotational_slip_for_config()   -> Geometry.rotational_slip
//     calibration.rotational_slip -- 1 REQUIRED field. Domain {0} u
//     [0.5, 1.0] (non-contiguous) -- same posture as config.proto's own
//     header note: no `(min)`/`(max)`/`(abs_max)` pair can express it, so
//     none is attached here; it stays in the thin hand-written validation
//     layer around the generated pydantic model (sprint.md Out of Scope).
//   rotation_calibration_for_config() -> Geometry.rotation_gain_pos/
//                                      rotation_offset/rotation_gain_neg/
//                                      rotation_offset_neg
//     calibration.rotation_gain/rotation_offset_deg/rotation_gain_neg/
//     rotation_offset_deg_neg -- 4 REQUIRED fields. Grouped under Geometry
//     (not a standalone group): sprint.md's own Step 3 module list names
//     "RobotLoop for geometry/rotation" as ONE configure() consumer, and
//     drivetrain.proto's existing DrivetrainConfig already names this exact
//     field cluster rotation_gain_pos/rotation_offset/rotation_gain_neg/
//     rotation_offset_neg -- mirrored verbatim here for continuity.
//   estimator_config_for_config()  -> Estimator.weight_heading_otos/
//                                      weight_omega_otos/staleness
//     estimator.weight_heading_otos/weight_omega_otos/staleness_ms -- 3
//     REQUIRED fields. `staleness` (not `staleness_ms`): boot_config.h's
//     own EstimatorBootConfig already names this field bare (`staleness`,
//     `// [ms]` tag) -- mirrored, not config.proto's EstimatorConfigPatch
//     spelling (`staleness_ms`), for the same C++-identifier reason
//     `reversal_dwell` above drops its JSON key's own "_ms" suffix.
//   shaper_config_for_config()     -> DELETED, 132-015. Formerly
//     Planner.shaper_a_max/shaper_a_decel/shaper_alpha_max/
//     shaper_alpha_decel/shaper_j_max/shaper_yaw_jerk_max (control.a_max/
//     a_decel/alpha_max/alpha_decel/j_max/yaw_jerk_max, 6 fields), mirroring
//     Config::ShaperBootConfig (boot_config.h) -- that struct's own doc
//     comment confirmed "currently unread by any live consumer"
//     (Motion::Planner uses its own hand-baked PlannerLimits, sourced from
//     the LIVE planner.* fields below, not this struct). 132-015's own
//     fresh grep re-confirmed zero live consumers and deleted the C++
//     struct, gen_boot_config.py's shaper_config_for_config(), and these 6
//     schema fields together (field numbers 17-22, now `reserved` below --
//     see the Planner message's own trailing comment).
//   wheel_correction_for_config()  -> Drive.wheel_gain_left_accel/
//                                      wheel_intercept_left_accel/
//                                      wheel_gain_left_decel/
//                                      wheel_intercept_left_decel/
//                                      wheel_gain_right_accel/
//                                      wheel_intercept_right_accel/
//                                      wheel_gain_right_decel/
//                                      wheel_intercept_right_decel
//     control.wheel_gain_{left,right}_{accel,decel} / control.
//     wheel_intercept_{left,right}_{accel,decel} -- 8 REQUIRED fields. The
//     sprint's headline per-wheel Stage-A drive-correction surface
//     (SUC-006) -- field names mirror sprint.md's own Drive::configure()
//     pseudocode verbatim (config.drive.wheelGainLeftAccel, etc.).
//   drive_config_for_config()      -> Drive.duty_per_speed_left/
//                                      duty_per_speed_right/crawl_pulse
//     control.duty_per_speed_left/duty_per_speed_right/crawl_pulse -- 3
//     REQUIRED fields.
//   wheel_controller_config_for_config() -> WheelControl.v_min/bias_max/
//                                      tau_adapt/a_steady/
//                                      deficit_threshold/deficit_window/
//                                      pid_kp/pid_ki/pid_i_max/pid_kaff/
//                                      pid_max
//     control.wheel_v_min/wheel_bias_max/wheel_tau_adapt/wheel_a_steady/
//     wheel_deficit_threshold/wheel_deficit_window_ms/wheel_pid_kp/
//     wheel_pid_ki/wheel_pid_i_max/wheel_pid_kaff/wheel_pid_max -- 11
//     REQUIRED fields. Field names mirror sprint.md's own Drive::
//     configure() pseudocode verbatim (config.wheelControl.pidKp, etc.).
//   planner_config_for_config()    -> Planner.v_max/omega_max/
//                                      control_period/actuation_delay/
//                                      settle_rest_velocity/
//                                      settle_rest_omega/
//                                      settle_epsilon_linear/
//                                      settle_epsilon_angular/
//                                      heading_hold_gain/decel_plan_fraction
//                                      PLUS PlannerShaper.a_max/a_decel/
//                                      alpha_max/alpha_decel/jerk_max/
//                                      yaw_jerk_max
//     planner.v_max/a_max/a_decel/omega_max/alpha_max/alpha_decel/
//     jerk_max/yaw_jerk_max/control_period/actuation_delay/
//     settle_rest_velocity/settle_rest_omega/settle_epsilon_linear/
//     settle_epsilon_angular/heading_hold_gain/decel_plan_fraction -- 16
//     REQUIRED fields total (the function's own docstring says "18"; the
//     actual `_require()` call count in the current source is 16 --
//     trusted over the stale docstring number), SPLIT (132-017) across
//     TWO generated groups/gen_boot_config.py functions
//     (`defaultPlannerGroup()`, 10 boot-only fields; `defaultPlannerShaper
//     Group()`, the 6 live shaper-ceiling fields) even though the JSON
//     source keys all still live under one `planner.*` section -- see
