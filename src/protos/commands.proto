syntax = "proto3";

package robot;

import "options.proto";

// ---------------------------------------------------------------------------
// Command-name registry (124-001, sprint 124 architecture Decision 2).
//
// Today the closed v5 wire verb set — and which verbs carry binary vs.
// cleartext data — lives independently in firmware dispatch, the host
// codec, and the published protocol doc: three places that can drift.
// This file is the ONE source all three are generated from or checked
// against.
//
// Every <COMMAND> token protocol v5's uniform packet grammar
// (`<COMMAND>[':' <data>]'\n'`, see sprint 124's
// `protocol-v5-one-line-packets-command-prefix-and-newline-cobs.md` §1)
// can legitimately carry gets one row below, with the ONE piece of
// metadata that discriminates how its <data> is read: `(binary)`. Under
// v5 this is the SOLE discriminator — nothing about a verb's own data
// bytes is ever inspected to decide text vs. binary, replacing the two
// content-sniffing heuristics this sprint deletes elsewhere
// (`kTextCommands[]`/`isRecognizedTextCommand()` in firmware,
// `_looks_like_text()`/`_TEXT_SAFE_BYTES` on the host).
//
// Scope (deliberately narrow — see sprint.md Step 3's module table):
// this registry declares ONLY a verb's name and its binary/cleartext
// flag. It does NOT declare:
//   - which direction(s) a verb travels (command-in vs. reply-out —
//     that's `App::Comms`'s own dispatch table);
//   - which handler runs it (`RobotLoop`'s job);
//   - a binary verb's data SHAPE (the existing `CommandEnvelope`/
//     `ReplyEnvelope` oneof arms in envelope.proto already own that).
// `ID` and `VER` are each ONE row even though they are both a command
// (host -> robot, no data) and a reply (robot -> host, cleartext data,
// e.g. `ID:<fields>`) — the registry doesn't distinguish direction, so
// a verb used both ways is not declared twice.
//
// gen_messages.py emits, from this one schema:
//   - src/firm/messages/commands.h — the `Verb` enum + `kVerbTable[]`,
//     the firmware-side constant set `App::Comms` dispatches against.
//   - src/host/robot_radio/io/wire_commands.py — the host-consumable
//     mirror (`VERBS`/`VERB_BY_NAME`/`BINARY_VERBS`/`CLEARTEXT_VERBS`).
//
// Adding a future verb means editing exactly this file (ticket 001's own
// acceptance criterion) — no parallel edit in firmware, host, or docs is
// needed to keep the verb set consistent.
// ---------------------------------------------------------------------------

// Verb — the closed v5 wire verb set. `VERB_UNSPECIFIED` is the required
// proto3 zero value and is never a real wire verb — not dispatched, not
// emitted, excluded from the generated `kVerbTable[]`/`VERBS` rows.
enum Verb {
  VERB_UNSPECIFIED = 0;

  // --- Cleartext command verbs (host -> robot), no data, no ':' ---
  HELLO = 1 [(binary) = false];
  PING  = 2 [(binary) = false];
  ID    = 3 [(binary) = false];
  VER   = 4 [(binary) = false];

  // --- Cleartext reply verbs (robot -> host) ---
  // DEVICE:<fields> -- boot/HELLO-reply identity banner (byte-frozen,
  // unchanged by the v5 grammar cutover).
  DEVICE = 5 [(binary) = false];
  // PONG:t=<ms> -- PING's reply (was "OK pong t=<ms>" pre-v5).
  PONG   = 6 [(binary) = false];
  // ID/VER also answer as reply verbs (ID -> "ID:<fields>", VER ->
  // "VER:<version>"), echoing the command verb above -- not redeclared.
  //
  // READY -- unsolicited, emitted ONCE when RobotLoop::boot() completes and
  // the loop will actually accept a Move.
  //
  // PING is a LIVENESS check, not a readiness check, and cannot be made into
  // one: comms_.pump() runs inside boot()'s own probe loop (123-006), so the
  // board answers PONG while still rejecting every Move with
  // ERR_NOT_CONFIGURED (rejectDuringBoot, 125-001). Measured 2026-07-29 over
  // direct serial: 5 of 6 fresh connections had their first Move rejected
  // for exactly this reason, with PING answering happily throughout, and the
  // gap is ~5s. A host that treats PONG as "go" loses its first command.
  //
  // Unsolicited rather than a query so a host never has to poll: connect()
  // simply reads until READY arrives. It rides the same one-off cleartext
  // path as DEVICE (sendReliable), immediately after the banner.
  READY  = 15 [(binary) = false];
  // STATUS -- ask, any time: "STATUS" in, "STATUS:k=v:k=v..." back.
  //
  // The QUERYABLE counterpart to READY. READY is edge-triggered and fires
  // once at boot; a host that connects later, or reconnects, has missed it
  // forever. Since 2026-07-29 telemetry is also silent while the robot is
  // parked, so the flags word is not readable either. STATUS closes both
  // gaps: it answers on demand, over cleartext, with no telemetry running
  // and no binary codec needed -- so it works from a plain serial terminal.
  //
  // key=value, colon-separated, deliberately extensible: the v5 grammar
  // ends the verb at the FIRST colon and treats every later byte as data,
  // so fields can be added without touching the parser. Both a command
  // (host -> robot) and its own reply verb, like ID and VER.
  STATUS = 16 [(binary) = false];
  // HELP -- "HELP" in, "HELP:<verb> <verb> ..." back: the cleartext verbs
  // this firmware actually answers.
  //
  // Generated by WALKING kVerbTable at runtime, not from a hand-written
  // list, so it cannot drift from the registry the dispatcher uses. Adding
  // a cleartext verb above makes it appear in HELP automatically; that is
  // the whole point of the list being generated from this file.
  //
  // Binary verbs are omitted deliberately: they are unusable from a
  // terminal (they need a COBS+CRC frame), so listing them would advertise
  // commands a human cannot type.
  HELP   = 17 [(binary) = false];
  // DBG -- unsolicited firmware->host debug message channel (129-003, issue
  // 05-dbg-debug-message-channel-for-bench-and-sim.md; stakeholder,
  // 2026-07-31: "Can we add another response field so that you can send
  // debug messages? ... Let's go make a DBG. It only needs to get compiled
  // in when you're on the bench or in SIM.").
  //
  // Cleartext, "DBG:<message>" -- App::debugf() (src/firm/app/debug.h)
  // formats a printf-style line and App::Comms::sendDebug() sends it on
  // both transports via the same one-off sendReliable() path READY/DEVICE
  // use, never the high-cadence async TLM path. Compiled in ONLY when
  // ROBOT_DEBUG is defined (a bench-only opt-in CMake option, mirroring
  // FAKE_OTOS) or HOST_BUILD is defined (Sim/host tests always have it) --
  // the shipped ARM release build has neither, so debugf()/App::Comms::
  // sendDebug() compile to nothing there: zero flash cost, zero wire
  // traffic. Registered here regardless (the closed verb set must name
  // every verb ever emitted, per this file's own header note) so the host
  // codec (wire_commands.py) always recognizes "DBG:" as a cleartext line
  // rather than counting it malformed on a bench/Sim build that DOES emit
  // it.
  DBG    = 18 [(binary) = false];

  // --- Binary command verbs (host -> robot) -- CommandEnvelope.cmd's
  // oneof arms (envelope.proto), also named on the wire per the uniform
  // grammar (e.g. "MOVE:<COBS+CRC frame>\n"). ---
  //
  // A verb's name here MUST be the upper-cased spelling of its
  // CommandEnvelope.cmd oneof arm name: both host senders derive the wire
  // prefix -- and therefore the CRC scope -- from
  // `WhichOneof("cmd").upper()` (io/serial_conn.py's and io/sim_config.py's
  // own `_envelope_command_name()`), so `wheels` <-> WHEELS and
  // `estop` <-> ESTOP is a hard correspondence, not a convention.
  MOVE   = 7 [(binary) = true];
  CONFIG = 8 [(binary) = true];
  STOP   = 9 [(binary) = true];

  // WHEELS/ESTOP -- the command-ingestion rework's two new verbs
  // (command-ingestion-ring-buffered-comms-subsystem-routing-two-stops.md
  // §2). They split what used to be one overloaded pair of meanings:
  //
  //   WHEELS -- the dumb teleop primitive, routed straight to App::Drive:
  //     per-wheel velocity plus a REQUIRED duration, so a dead host can
  //     never mean a runaway. It supersedes whatever the planner was
  //     doing (RobotLoop::routeCommand clears the planner on arrival).
  //   ESTOP  -- "halt now, everywhere": zeroes App::Drive AND clears
  //     Motion::Planner's active+pending queue, with no completion acks
  //     for the discarded entries.
  //
  // STOP keeps its verb and its field number but CHANGES MEANING with
  // this change: it is now a PLANNED stop that enters the planner's queue
  // and executes in sequence. Callers that meant "halt now" move to
  // ESTOP. That is a semantic wire change, not a schema one -- hence no
  // renumbering here.
  WHEELS = 13 [(binary) = true];
  ESTOP  = 14 [(binary) = true];

  // --- Binary reply verbs (robot -> host) -- ReplyEnvelope.body's
  // existing three oneof arms (envelope.proto). TLM is the only one with
  // a live producer today; OK/ERR are schema-declared with no current
  // firmware call site (envelope.proto's own doc comment) -- registered
  // here anyway, since the grammar requires every verb ever emitted to
  // be a closed-set member, not just the ones currently exercised. ---
  TLM = 10 [(binary) = true];
  OK  = 11 [(binary) = true];
  ERR = 12 [(binary) = true];

  // GET_CONFIG/CFG -- 132-011 (GetConfig/ConfigSnapshot wire read-back):
  // the read-back half of the CONFIG binary arm's new internal shape
  // (robot_config.proto), the first genuinely NEW binary command/reply
  // PAIR added since WHEELS/ESTOP. GET_CONFIG (host->robot) carries
  // CommandEnvelope.cmd.get_config (a GetConfig{target}); its arm name
  // ("get_config") is load-bearing the SAME way move/wheels/estop's are
  // (WhichOneof("cmd").upper() derives the wire prefix), hence the
  // underscore here rather than a single word. CFG (robot->host) carries
  // ReplyEnvelope.body.cfg (a ConfigSnapshot{target, body}) -- unlike
  // GET_CONFIG, its arm name is NOT wire-derived (Comms::sendReply()'s
  // bodyKindToVerb() is a hand-written switch, not a string derivation),
  // so "cfg"/"CFG" is a naming CHOICE, chosen to match this project's own
  // long-anticipated vocabulary (see io/serial_conn.py's SerialConnection
  // class docstring, which has named a future "cfg" reply verb since
  // before this ticket existed).
  GET_CONFIG = 19 [(binary) = true];
  CFG        = 20 [(binary) = true];

  // SET_FIELD -- 132-012 (SetConfigField / Configurator::applyField(), the
  // dev-mode single-value push the-configuration-object.md's own "Updating
  // one value: (target, field number, value)" section describes): the
  // WRITE half of GET_CONFIG's read-back pair, host->robot, carrying
  // CommandEnvelope.cmd.set_field (robot_config.proto's SetConfigField{
  // target, field, value}). Its arm name ("set_field") is load-bearing the
  // SAME way move/wheels/estop/get_config's are (WhichOneof("cmd").upper()
  // derives the wire prefix) -- but DELIBERATELY spelled SHORTER than the
  // message type it carries (SetConfigField), unlike GET_CONFIG's own
  // exact-name mirror of GetConfig: GET_CONFIG (10 bytes) is already this
  // schema's longest verb name and therefore the sole driver of
  // `Comms::kMaxCommandPrefixBytes`/`kMaxLineBytes` (comms.h) -- 249 bytes,
  // ONE byte below `Com::SerialPort::kTxBufferCapacity` (250) as of
  // 132-011, already flagged there as a real headroom concern. The literal
  // mirror "SET_CONFIG_FIELD" (17 bytes) would push kMaxCommandPrefixBytes
  // from 11 to 18 and kMaxLineBytes to 256 -- OVER the 250-byte TX ring
  // ceiling. "SET_FIELD" (9 bytes) stays under GET_CONFIG's own 10, so
  // this verb pair does NOT become the new worst-case name and the 249-byte
  // figure is unchanged by this addition.
  SET_FIELD  = 21 [(binary) = true];
  // SEED -- "SEED:<x>,<y>,<heading>" in, "SEED:<x>:<y>:<mrad>" back.
  // Seeds the robot's world pose (centre of rotation, [mm] [mm] [rad]) from
  // an external fix -- normally the overhead camera at the start of a run.
  // Writes BOTH pose sources: the OTOS chip's own position register (lever
  // arm applied in firmware by Devices::RealOtos) and the encoder odometry,
  // so the two start agreed and their later divergence IS the drift.
  //
  // Cleartext, so it works from a plain terminal with no binary codec. Both
  // a command and its own reply verb, like ID, VER and STATUS.
  SEED       = 22 [(binary) = false];
  // POSE -- "POSE" in, "POSE:<ox>:<oy>:<omrad>:<ex>:<ey>:<emrad>:<fresh>" back.
  // The OTOS chip's world pose and the encoder odometry's, in one line, in
  // integer mm and milliradians (newlib-nano printf has no float).
  //
  // Two pose sources seeded from one fix (see SEED) must agree at t=0; their
  // divergence over a run IS the drift being measured, so reporting them
  // together -- same cycle, same frame -- is the measurement. Cleartext so a
  // control loop can poll it without the binary codec.
  POSE       = 23 [(binary) = false];

  // GO_TO -- 135-004 (sprint 135, "GO_TO navigator in the motion library"):
  // hands CommandEnvelope.cmd.go_to (envelope.proto's GoTo{x, y, frame,
  // speed, arrive, timeout, id}) to App::RobotLoop::handleGoto(), which
  // arms Motion::Navigator (135-003) to drive the point to completion by
  // repeatedly re-solving a tangent arc against live OTOS pose. Its arm
  // name is load-bearing the SAME way move/wheels/estop/get_config/
  // set_field's are (WhichOneof("cmd").upper() derives the wire prefix,
  // io/serial_conn.py's/io/sim_config.py's own `_envelope_command_name()`)
  // -- hence the underscore, so this verb uppercases to exactly GO_TO,
  // matching CommandEnvelope's own `go_to` arm name exactly (never a bare
  // "goto", a C++ keyword).
  GO_TO      = 24 [(binary) = true];

  // CALIBRATE -- re-run the OTOS gyro bias calibration on demand, robot
  // parked (envelope.proto's `Calibrate` arm carries the payload; see its
  // doc comment for the 2026-08-08 boot-while-handled incident this
  // answers). Arm name load-bearing per the same rule as move/wheels/
  // estop/get_config/set_field/go_to: `WhichOneof("cmd").upper()` must
  // read exactly CALIBRATE. 9 bytes -- under GET_CONFIG's 10, so the
  // kMaxCommandPrefixBytes/kMaxLineBytes budget (comms.h) is unchanged.
  CALIBRATE  = 25 [(binary) = true];
}
