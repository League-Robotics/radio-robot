syntax = "proto3";

package robot;

import "options.proto";

// ---------------------------------------------------------------------------
// Shared geometric and kinematic value types
// ---------------------------------------------------------------------------

// 2-D pose: position in mm, heading in radians. Packed fixed-point on the
// wire (sprint 124 ticket 008, issue §B3): x/y at 1mm scale (±32m), h at
// 1mrad scale (±pi) -- generated pack*()/unpack*() conversion methods live
// on the generated struct (options.proto's (scale) doc comment).
message Pose2D {
  sint32 x  = 1 [(scale) = 1.0, (abs_max) = 32000];    // [mm]
  sint32 y  = 2 [(scale) = 1.0, (abs_max) = 32000];    // [mm]
  sint32 h  = 3 [(scale) = 0.001, (abs_max) = 3142];   // [rad]
}

// Body-frame twist for differential (non-holonomic) drivetrains.
message BodyTwist {
  float v     = 1;  // forward speed, mm/s
  float omega = 2; // angular rate, rad/s
}

// Body-frame twist for holonomic (3-DOF) drivetrains. Packed fixed-point on
// the wire (124-008, issue §B3): v_x/v_y at 0.1mm/s scale (±400mm/s), omega
// at 0.01rad/s scale (±10rad/s).
message BodyTwist3 {
  sint32 v_x   = 1 [(scale) = 0.1, (abs_max) = 4000];    // [mm/s]
  sint32 v_y   = 2 [(scale) = 0.1, (abs_max) = 4000];    // [mm/s]
  sint32 omega = 3 [(scale) = 0.01, (abs_max) = 1000];   // [rad/s]
}

// Body-frame acceleration (holonomic).
message BodyAccel {
  float a_x = 1;
  float a_y = 2;
}

// Sensor freshness and validity stamp.
message ValueSet {
  uint32 lag      = 1;
  uint32 last_upd = 2;
  bool   valid    = 3;
}

// A pose+twist snapshot with a validity stamp.
message PoseEstimate {
  Pose2D    pose  = 1;
  BodyTwist3 twist = 2;
  ValueSet  stamp = 3;
}

// Per-wheel target; nullable fields mean "don't command this axis".
message WheelTarget {
  optional float speed    = 1;  // null → don't command speed
  optional float position = 2;  // null → don't command position
}

// PID + feedforward gains for a velocity controller.
message Gains {
  float kp    = 1;
  float ki    = 2;
  float kff   = 3;
  float i_max = 4;
  float kaw   = 5;  // anti-windup coefficient
}

// Motor neutral mode.
enum Neutral {
  BRAKE = 0;
  COAST = 1;
}

// ---------------------------------------------------------------------------
// Inter-subsystem command bus types
// ---------------------------------------------------------------------------

// Compact routable command emitted by tick() onto the command bus.
// verb_id identifies the target subsystem + action; args are the payload.
message OutCommand {
  uint32 verb_id  = 1;
  repeated float args = 2 [(max_count) = 4];
  uint32 argc     = 3;
  bool   priority = 4;  // true → push_front (safety/ESTOP)
}

// Fixed-capacity batch of OutCommands returned by tick().
message CommandBatch {
  repeated OutCommand cmds = 1 [(max_count) = 8];
  uint32 count = 2;
}

// Declared capability axes: which command modes are accepted and which
// state fields are populated.
message Capabilities {
  repeated uint32 command_modes    = 1 [(max_count) = 8];
  repeated uint32 state_fields     = 2 [(max_count) = 16];
  bool     holonomic               = 3;
  bool     onboard_position        = 4;
  uint32   wheel_count             = 5;
}
